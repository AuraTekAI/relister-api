services:
  web:
    container_name: web
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./src/.env
    command: >
      sh -c "python /app/src/manage.py runserver 0.0.0.0:8000"
    networks:
      - internal_network
    depends_on:
      - redis

  redis:
    container_name: redis
    restart: unless-stopped
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --databases 2 --replica-read-only no
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
    networks:
      - internal_network

  db:
    container_name: db
    restart: unless-stopped
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    volumes:
      - local-db-data:/var/lib/postgresql/data
    env_file:
      - ./src/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal_network

  beat-scheduler:
    container_name: beat-scheduler
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/beat/Dockerfile
    volumes:
      - .:/app
    env_file:
      - ./src/.env
    working_dir: /app/src
    depends_on:
      - redis
      - web
    command: >
      sh -c "
         python /app/src/manage.py migrate &&
         celery -A relister beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    networks:
      - internal_network

  celery-worker-scheduling:
    container_name: celery-worker-scheduling
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/beat/Dockerfile
    volumes:
      - .:/app
    env_file:
      - ./src/.env
    working_dir: /app/src
    depends_on:
      - redis
      - web
    command: >
      sh -c "celery -A relister worker --loglevel=info --hostname=scheduling@%h -Q scheduling_queue -E --concurrency=1"
    networks:
      - internal_network

  celery-worker-relister:
    container_name: celery-worker-relister
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/beat/Dockerfile
    volumes:
      - .:/app
    env_file:
      - ./src/.env
    working_dir: /app/src
    depends_on:
      - redis
      - web
    command: >
      sh -c "celery -A relister worker --loglevel=info --hostname=email@%h -Q relister_queue -E --concurrency=1"
    networks:
      - internal_network

  # Consumer for `image_ingest_queue` (VehicleListing.tasks
  # process_vehicle_listing_image_task / gc_hosted_image_task). Those tasks were
  # added with a new queue but no worker to drain it, so every scraped photo
  # enqueued a message nothing would ever run — the hosting pipeline silently
  # did nothing while Redis accumulated tens of thousands of tasks.
  #
  # Kept as its own container rather than folded into an existing worker so a
  # burst of image downloads can't starve scraping/relisting, matching the
  # queue separation the task itself documents. Concurrency 2 because the work
  # is download-then-WebP-encode (IO bound with a CPU tail); the real throttle
  # is the task's own VEHICLE_IMAGE_DOWNLOAD_RATE_LIMIT.
  celery-worker-image:
    container_name: celery-worker-image
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/beat/Dockerfile
    volumes:
      - .:/app
    env_file:
      - ./src/.env
    working_dir: /app/src
    depends_on:
      - redis
      - web
    command: >
      sh -c "celery -A relister worker --loglevel=info --hostname=image@%h -Q image_ingest_queue -E --concurrency=2"
    networks:
      - internal_network

volumes:
  local-db-data:

networks:
  internal_network:
    driver: bridge
